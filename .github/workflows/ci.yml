name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Shell syntax and lint
        shell: bash
        run: |
          set -euo pipefail
          find package -type f \( -name '*.sh' -o -path '*/usr/bin/cf-ip-auto' -o -path '*/usr/bin/cf-ip-auto-*' \) -exec bash -n {} +
          sh -n package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip
          sh -n package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip_publisher
          sh -n package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/cf_ip
          shellcheck -x -S error package/luci-app-cloudflare-ip/root/usr/bin/cf-ip-auto-v2 \
            package/luci-app-cloudflare-ip/root/usr/libexec/cf-ip/*.sh \
            package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip \
            package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/cf_ip
      - name: JSON and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find package -type f -name '*.json' -exec jq empty {} +
          find package -type f -name '*.js' -exec node --check {} \;
      - name: V2 host contract tests
        run: |
          bash tests/v2-observation.sh
          bash tests/v2-rill-shadow.sh
          bash tests/v2-source-engine.sh
          bash tests/source-size-cap.sh
          bash tests/v2-single-cfst.sh
          bash tests/v2-lan-publisher.sh
          bash tests/v2-status.sh
          bash tests/v2-transaction.sh
          bash tests/v2-candidate-budget.sh
          bash tests/v2-cfst-exact-input.sh
          bash tests/v2-measurement-deadline.sh
          bash tests/service-running-timeout.sh
          bash tests/status-running-timeout.sh
          bash tests/monotonic-deadline.sh
          bash tests/external-operation-timeout-tree.sh
          bash tests/watchdog-timer-cleanup.sh
          bash tests/cron-semantic-validation.sh
          bash tests/rill-feedback-negative.sh
          jq empty plans/rill/drift-decision.json
          bash tests/recovery-deadline.sh
          bash tests/transaction-commit-failure.sh
          bash tests/openclash-intended-mapping-negative.sh
          bash tests/security-contract.sh
          bash tests/cron-contract.sh
          bash tests/transaction-signal-rollback.sh
          bash tests/signal-child-tree-rollback.sh
          bash tests/transaction-hard-deadline.sh
          bash tests/openclash-protocol-eligibility.sh
          bash tests/rill-disabled-noexec.sh
          bash tests/rill-status-timeout.sh
          bash tests/scheduler-deterministic.sh
          bash tests/history-freshness.sh
          bash tests/special-address-contract.sh
          bash tests/ipv6-prefix-contract.sh
          bash tests/no-delay-contract.sh
          bash tests/service-state-preservation.sh
          bash tests/semantic-config-validation.sh

  legacy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Run 1.8.3 preservation contracts
        run: |
          set -euo pipefail
          bash tests/openclash-xhttp-filter.sh
          bash tests/openclash-protocol-matrix.sh
          bash tests/regex-ip-suffix.sh
          bash tests/passwall-managed.sh
          bash tests/security-contract.sh
          for test in tests/legacy/*.sh; do
            case "$test" in *_helpers.sh) continue;; esac
            bash "$test"
          done

  openwrt-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: v24.10.5
            pkgtype: ipk
            arch: x86_64
          - branch: v25.12.0
            pkgtype: apk
            arch: x86_64
          - branch: v24.10.8
            pkgtype: ipk
            arch: x86_64
          - branch: v25.12.5
            pkgtype: apk
            arch: x86_64
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}
      options: --user root
    steps:
      - uses: actions/checkout@v7
        with:
          path: luci-app-cloudflare-ip
      - name: Checkout canonical Runtime package at immutable contract commit
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(jq -r '.openwrtPackage.commit' luci-app-cloudflare-ip/contracts/rill-runtime.json)
          [[ "$package_commit" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/hello-yunshu/rill-openwrt-packages.git rill-openwrt-packages
          git -C rill-openwrt-packages fetch --depth=1 origin "$package_commit"
          git -C rill-openwrt-packages checkout --detach "$package_commit"
          test "$(git -C rill-openwrt-packages rev-parse HEAD)" = "$package_commit"
      - name: Cache OpenWrt Rust toolchain and Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            /builder/dl/cargo
            /builder/rustup
            /builder/cargo
          key: cloudflare-openwrt-rust-${{ runner.os }}-${{ matrix.branch }}-${{ hashFiles('rill-openwrt-packages/package/rill-runtime/Makefile', 'rill-openwrt-packages/scripts/prepare_rust_toolchain.sh') }}
          restore-keys: |
            cloudflare-openwrt-rust-${{ runner.os }}-${{ matrix.branch }}-
      - name: Prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          cd /builder
          mkdir -p /builder/shared-workdir
          rm -rf /builder/shared-workdir/build
          ln -sf /builder /builder/shared-workdir/build
          ./scripts/feeds update base packages luci
          ./scripts/feeds install luci-base bash curl tar jq ca-bundle ca-certificates uhttpd rust
          for rust_makefile in feeds/packages/lang/rust/Makefile feeds/packages/lang/rust/rust-host-build.mk; do
            if [ -f "$rust_makefile" ]; then
              sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' "$rust_makefile"
            fi
          done
          if grep -R -n -- '--set=llvm.download-ci-llvm=true' feeds/packages/lang/rust; then
            echo 'OpenWrt Rust feed still enables CI LLVM downloads' >&2
            exit 1
          fi
          rill_workspace="$GITHUB_WORKSPACE/rill-openwrt-packages"
          (
            cd "$rill_workspace"
            GITHUB_WORKSPACE="$rill_workspace" RUST_STAGING_DIR=/builder/staging_dir/host \
              ./scripts/prepare_rust_toolchain.sh
          )
          cp -r "$GITHUB_WORKSPACE/luci-app-cloudflare-ip/package/luci-app-cloudflare-ip" ./package/
          cp -r "$GITHUB_WORKSPACE/rill-openwrt-packages/package/rill-runtime" ./package/
          {
            echo 'CONFIG_PACKAGE_rill-runtime=y'
            echo 'CONFIG_PACKAGE_luci-app-cloudflare-ip=y'
            echo 'CONFIG_PACKAGE_luci-app-cloudflare-ip-rill=y'
          } >> .config
          make defconfig
      - name: Build package
        shell: bash
        working-directory: /builder
        run: |
          set -euo pipefail
          unset CI
          build_helper="$GITHUB_WORKSPACE/luci-app-cloudflare-ip/scripts/openwrt-build-diagnostic.sh"
          bash "$build_helper" package/rill-runtime/compile
          if [ "${{ matrix.pkgtype }}" = apk ]; then
            # APK rejects the source development suffix. Patch only the
            # checked-out package Makefile so dependency PKG_VERSION values
            # remain untouched and the source contract stays exact.
            sed -i 's/^PKG_VERSION:=2.0.0-dev$/PKG_VERSION:=2.0.0.1/' package/luci-app-cloudflare-ip/Makefile
            bash "$build_helper" package/luci-app-cloudflare-ip/compile
          else
            bash "$build_helper" package/luci-app-cloudflare-ip/compile
          fi
      - name: Inspect package artifact
        shell: bash
        working-directory: /builder
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          base_file=$(find ./bin -type f -name "luci-app-cloudflare-ip*.${{ matrix.pkgtype }}" ! -name '*-rill*' | head -n1)
          rill_file=$(find ./bin -type f -name "luci-app-cloudflare-ip-rill*.${{ matrix.pkgtype }}" | head -n1)
          test -n "$base_file"; test -n "$rill_file"
          for file in "$base_file" "$rill_file"; do
            cp "$file" "$GITHUB_WORKSPACE/output/"
            mode=base; [[ "${file##*/}" == *-rill* ]] && mode=rill
            case "${file##*.}" in
              ipk) tar -tf "$file" >/dev/null
                   bash "$GITHUB_WORKSPACE/luci-app-cloudflare-ip/tests/package-content-contract.sh" "$file" ipk "$mode" ;;
              apk) test -x /builder/staging_dir/host/bin/apk
                   /builder/staging_dir/host/bin/apk --allow-untrusted adbdump "$file" >/dev/null
                   APK=/builder/staging_dir/host/bin/apk bash "$GITHUB_WORKSPACE/luci-app-cloudflare-ip/tests/package-content-contract.sh" "$file" apk "$mode" ;;
            esac
          done
          (cd "$GITHUB_WORKSPACE/output" && sha256sum -- *) > "$GITHUB_WORKSPACE/output/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: luci-app-cloudflare-ip-${{ matrix.pkgtype }}-${{ matrix.branch }}
          path: output/
          if-no-files-found: error

  rill-runtime-integration:
    name: Same-release generic Runtime integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout canonical Runtime package at immutable contract commit
        shell: bash
        run: |
          set -euo pipefail
          package_commit=$(jq -r '.openwrtPackage.commit' contracts/rill-runtime.json)
          [[ "$package_commit" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/hello-yunshu/rill-openwrt-packages.git rill-openwrt-packages
          git -C rill-openwrt-packages fetch --depth=1 origin "$package_commit"
          git -C rill-openwrt-packages checkout --detach "$package_commit"
          test "$(git -C rill-openwrt-packages rev-parse HEAD)" = "$package_commit"
      - name: Verify consumer contract before building Runtime
        run: python3 scripts/check_rill_dependency.py --package-dir rill-openwrt-packages
      - name: Build the exact Stable-tag Runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' rill-openwrt-packages/package/rill-runtime/Makefile)
          package_hash=$(sed -n 's/^PKG_HASH:=//p' rill-openwrt-packages/package/rill-runtime/Makefile)
          package_commit=$(git -C rill-openwrt-packages rev-parse HEAD)
          metadata_hash=$(jq -r '.upstream.archiveSha256' rill-openwrt-packages/metadata/rill-runtime.json)
          test "$package_hash" = "$metadata_hash"
          qualification_run=$(gh api "repos/hello-yunshu/rill-openwrt-packages/actions/workflows/qualify.yml/runs?head_sha=${package_commit}&status=completed&per_page=100" --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n1)
          test -n "$qualification_run"
          gh api "repos/hello-yunshu/rill-openwrt-packages/actions/runs/${qualification_run}/artifacts" --jq '.artifacts[] | select(.name=="qualification-evidence" and .expired==false) | .id' | grep -q .
          evidence_dir="$RUNNER_TEMP/rill-qualification"
          mkdir -p "$evidence_dir"
          gh run download "$qualification_run" --repo hello-yunshu/rill-openwrt-packages --name qualification-evidence --dir "$evidence_dir"
          evidence_file=$(find "$evidence_dir" -type f -name 'qualification.json' -print -quit)
          test -n "$evidence_file"
          expected_release=$(sed -n 's/^PKG_RELEASE:=//p' rill-openwrt-packages/package/rill-runtime/Makefile)
          expected_upstream_repository=$(jq -r '.upstream.repository' rill-openwrt-packages/metadata/rill-runtime.json | sed -E 's#^https://github.com/##; s#\.git$##')
          expected_upstream_tag=$(jq -r '.upstream.tag' rill-openwrt-packages/metadata/rill-runtime.json)
          expected_upstream_commit=$(jq -r '.upstream.commit' rill-openwrt-packages/metadata/rill-runtime.json)
          python3 rill-openwrt-packages/scripts/verify_qualification.py "$evidence_file" \
            --package-commit "$package_commit" \
            --version "$version" \
            --release "$expected_release" \
            --upstream-repository "$expected_upstream_repository" \
            --upstream-tag "$expected_upstream_tag" \
            --upstream-commit "$expected_upstream_commit"
          qualification_manifest_sha256=$(sha256sum "$evidence_file" | awk '{print $1}')
          upstream_commit=$(jq -r '.upstream.commit' rill-openwrt-packages/metadata/rill-runtime.json)
          git clone --depth 1 --branch "v${version}" https://github.com/hello-yunshu/rill-ml.git rill-ml
          test "$(git -C rill-ml rev-parse HEAD)" = "$upstream_commit"
          cargo build --locked --release --manifest-path rill-ml/Cargo.toml -p rill-runtime
          {
            echo "version=$version"
            echo "package_commit=$package_commit"
            echo "qualification_run=$qualification_run"
            echo "qualification_manifest_sha256=$qualification_manifest_sha256"
            echo "upstream_tag=$expected_upstream_tag"
            echo "commit=$upstream_commit"
            echo "source_archive_sha256=$metadata_hash"
            echo "binary_sha256=$(sha256sum rill-ml/target/release/rill-runtime | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"
      - name: Execute the real Cloudflare feedback integration
        run: |
          bash tests/rill-feedback-integration.sh rill-ml/target/release/rill-runtime
          bash tests/rill-feedback-negative.sh
      - name: Record same-release evidence
        shell: bash
        env:
          VERSION: ${{ steps.runtime.outputs.version }}
          PACKAGE_COMMIT: ${{ steps.runtime.outputs.package_commit }}
          QUALIFICATION_RUN: ${{ steps.runtime.outputs.qualification_run }}
          QUALIFICATION_MANIFEST_SHA256: ${{ steps.runtime.outputs.qualification_manifest_sha256 }}
          COMMIT: ${{ steps.runtime.outputs.commit }}
          UPSTREAM_TAG: ${{ steps.runtime.outputs.upstream_tag }}
          SOURCE_ARCHIVE_SHA256: ${{ steps.runtime.outputs.source_archive_sha256 }}
          BINARY_SHA256: ${{ steps.runtime.outputs.binary_sha256 }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" --arg packageCommit "$PACKAGE_COMMIT" --arg qualificationRun "$QUALIFICATION_RUN" --arg qualificationManifestSha256 "$QUALIFICATION_MANIFEST_SHA256" --arg upstreamTag "$UPSTREAM_TAG" --arg commit "$COMMIT" --arg sourceArchiveSha256 "$SOURCE_ARCHIVE_SHA256" --arg binarySha256 "$BINARY_SHA256" \
            '{schemaVersion:1,consumer:"hello-yunshu/luci-app-cloudflare-ip",package:{repository:"hello-yunshu/rill-openwrt-packages",commit:$packageCommit,qualificationRunId:($qualificationRun|tonumber),qualificationManifestSha256:$qualificationManifestSha256},runtime:{version:$version,tag:$upstreamTag,commit:$commit,sourceArchiveSha256:$sourceArchiveSha256,binarySha256:$binarySha256},integration:{test:"tests/rill-feedback-integration.sh",status:"pass",sameRelease:true}}' \
            > rill-runtime-integration.json
      - uses: actions/upload-artifact@v7
        with:
          name: rill-runtime-integration-evidence
          path: rill-runtime-integration.json
          if-no-files-found: error

  package-release-guard:
    runs-on: ubuntu-latest
    needs: [host-contract, openwrt-package, rill-runtime-integration]
    steps:
      - uses: actions/checkout@v7
      - name: Verify development release guard
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            [[ "$version" != *-dev ]]
          else
            test "$version" = 2.0.0-dev
          fi

  rpc-luci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install contract tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: RPC and LuCI dispatch contracts
        run: |
          set -euo pipefail
          bash tests/legacy/rpc-roundtrip.sh
          bash tests/legacy/luci-static-contract.sh
          jq empty package/luci-app-cloudflare-ip/root/usr/share/luci/menu.d/luci-app-cloudflare-ip.json
          jq empty package/luci-app-cloudflare-ip/root/usr/share/rpcd/acl.d/luci-app-cloudflare-ip.json

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest "$RUNNER_TEMP/bin"
      - name: Lint workflows
        run: "${{ runner.temp }}/bin/actionlint"

  real-cfst-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Download and execute real CFST
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cfst"
          release_json="$RUNNER_TEMP/cfst/release.json"
          curl -fsSL --retry 3 https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest -o "$release_json"
          asset_url=$(jq -r '.assets[] | select(.name|test("linux_amd64.*tar.gz$"; "i")) | .browser_download_url' "$release_json" | head -n1)
          test -n "$asset_url"
          curl -fsSL --retry 3 "$asset_url" -o "$RUNNER_TEMP/cfst/archive"
          tar -xf "$RUNNER_TEMP/cfst/archive" -C "$RUNNER_TEMP/cfst"
          cfst=$(find "$RUNNER_TEMP/cfst" -type f -name cfst | head -n1)
          test -n "$cfst"
          chmod +x "$cfst"
          cat > "$RUNNER_TEMP/cfst/input.txt" <<'EOF_INPUT'
          104.16.1.1/32
          2606:4700::1111/128
          EOF_INPUT
          bash tests/cfst-real-smoke.sh "$cfst" "$RUNNER_TEMP/cfst/input.txt"

  release-asset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify complete release asset/checksum contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/release-contract"
          mkdir -p "$tmp"
          version=$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          touch "$tmp/luci-app-cloudflare-ip_2.0.0-dev-1.ipk" "$tmp/luci-app-cloudflare-ip-rill_2.0.0-dev-1.ipk" "$tmp/luci-app-cloudflare-ip_2.0.0-dev-1.apk" "$tmp/luci-app-cloudflare-ip-rill_2.0.0-dev-1.apk"
          (cd "$tmp" && sha256sum luci-app-cloudflare-ip* > sha256sums.txt)
          bash tests/release-asset-contract.sh "$tmp" "$version"

  qualification-guard:
    if: always()
    needs: [host-contract, legacy-contract, rpc-luci-contract, openwrt-package, rill-runtime-integration, package-release-guard, workflow-lint, real-cfst-smoke, release-asset-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")'
          echo QUALIFICATION_COMPLETE

  evidence-manifest:
    if: always()
    needs: [host-contract, legacy-contract, rpc-luci-contract, openwrt-package, rill-runtime-integration, package-release-guard, workflow-lint, real-cfst-smoke, release-asset-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate exact qualification manifest
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '[.artifacts[] | {name: .name, digest: (.digest // null), size: .size_in_bytes}]' | jq -s 'add')"
          asset_dir="$RUNNER_TEMP/qualification-assets"
          mkdir -p "$asset_dir"
          for artifact in luci-app-cloudflare-ip-ipk-v24.10.5 luci-app-cloudflare-ip-apk-v25.12.0; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$asset_dir/$artifact"
          done
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rill-runtime-integration-evidence --dir "$asset_dir/rill-runtime-integration"
          asset_files='[]'
          while IFS= read -r -d '' file; do
            hash=$(sha256sum "$file" | awk '{print $1}')
            rel="${file#"$asset_dir"/}"
            asset_files=$(jq --arg path "$rel" --arg sha "$hash" '. + [{path:$path,sha256:$sha}]' <<<"$asset_files")
          done < <(find "$asset_dir" -type f \( -name '*.ipk' -o -name '*.apk' \) -print0)
          test "$(jq 'length' <<<"$asset_files")" -eq 4
          rill_evidence_dir="$asset_dir/rill-runtime-integration"
          rill_evidence_file=$(find "$rill_evidence_dir" -type f -name 'rill-runtime-integration.json' -print -quit)
          test -n "$rill_evidence_file"
          RESULTS="$RESULTS" ARTIFACTS="$ARTIFACTS" ASSET_FILES="$asset_files" RILL_EVIDENCE="$(cat "$rill_evidence_file")" bash tests/evidence-manifest.sh qualification.json
      - uses: actions/upload-artifact@v7
        with:
          name: qualification-evidence
          path: qualification.json
          if-no-files-found: error
