name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Shell syntax and lint
        shell: bash
        run: |
          set -euo pipefail
          find package -type f \( -name '*.sh' -o -path '*/usr/bin/cf-ip-auto' -o -path '*/usr/bin/cf-ip-auto-*' \) -exec bash -n {} +
          sh -n package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip
          sh -n package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip_publisher
          sh -n package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/cf_ip
          shellcheck -x -S error package/luci-app-cloudflare-ip/root/usr/bin/cf-ip-auto-v2 \
            package/luci-app-cloudflare-ip/root/usr/libexec/cf-ip/*.sh \
            package/luci-app-cloudflare-ip/root/etc/init.d/cf_ip \
            package/luci-app-cloudflare-ip/root/usr/libexec/rpcd/cf_ip
      - name: JSON and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find package -type f -name '*.json' -exec jq empty {} +
          find package -type f -name '*.js' -exec node --check {} \;
      - name: V2 host contract tests
        run: |
          bash tests/v2-observation.sh
          bash tests/v2-rill-shadow.sh
          bash tests/v2-source-engine.sh
          bash tests/v2-single-cfst.sh
          bash tests/v2-lan-publisher.sh
          bash tests/v2-status.sh
          bash tests/v2-transaction.sh
          bash tests/v2-candidate-budget.sh
          bash tests/v2-cfst-exact-input.sh
          bash tests/v2-measurement-deadline.sh
          bash tests/security-contract.sh

  legacy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Run 1.8.3 preservation contracts
        run: |
          set -euo pipefail
          bash tests/openclash-xhttp-filter.sh
          bash tests/openclash-protocol-matrix.sh
          bash tests/regex-ip-suffix.sh
          bash tests/passwall-managed.sh
          bash tests/security-contract.sh
          for test in tests/legacy/*.sh; do
            case "$test" in *_helpers.sh) continue;; esac
            bash "$test"
          done

  rill-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: Format
        working-directory: rill-adapter
        run: cargo fmt --check
      - name: Clippy
        working-directory: rill-adapter
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: rill-adapter
        run: cargo test
      - name: Build consumer adapter
        working-directory: rill-adapter
        run: cargo build --release
      - name: Consumer smoke
        run: bash tests/rill-adapter-smoke.sh rill-adapter/target/release/cf-ip-rill

  rill-musl-build-and-execute:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            qemu: native
            suffix: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            qemu: qemu-aarch64-static
            suffix: linux-aarch64-musl
          - target: riscv64gc-unknown-linux-musl
            qemu: qemu-riscv64-static
            suffix: linux-riscv64-musl
          - target: armv7-unknown-linux-musleabihf
            qemu: qemu-arm-static
            suffix: linux-armv7-musl
          - target: i686-unknown-linux-musl
            qemu: qemu-i386-static
            suffix: linux-i686-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - name: Install cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static python3-pip
          pip3 install --disable-pip-version-check 'cargo-zigbuild==0.20.1'
      - name: Build consumer-owned adapter
        working-directory: rill-adapter
        run: cargo zigbuild --release --target '${{ matrix.target }}'
      - name: Real-execute target binary
        shell: bash
        run: |
          set -euo pipefail
          bin="rill-adapter/target/${{ matrix.target }}/release/cf-ip-rill"
          state="$RUNNER_TEMP/cf-ip-rill-state.json"
          if [ '${{ matrix.qemu }}' = native ]; then
            "$bin" status --state "$state" | tee status.json
            bash tests/rill-adapter-smoke.sh "$bin"
          else
            '${{ matrix.qemu }}' "$bin" status --state "$state" | tee status.json
            RUNNER='${{ matrix.qemu }}' bash tests/rill-adapter-smoke.sh "$bin"
          fi
          jq -e '.success == true and .rillVersion == "1.5.3" and .adapterProtocolVersion == 1' status.json
          mkdir -p dist
          version=$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          cp "$bin" "dist/cf-ip-rill-${version}-${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cf-ip-rill-${{ matrix.suffix }}
          path: dist/cf-ip-rill-*
          if-no-files-found: error

  openwrt-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: v24.10.5
            pkgtype: ipk
            arch: x86_64
          - branch: v25.12.0
            pkgtype: apk
            arch: x86_64
    container:
      image: ghcr.io/openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          path: luci-app-cloudflare-ip
      - name: Prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          cd /builder
          mkdir -p /builder/shared-workdir
          rm -rf /builder/shared-workdir/build
          ln -sf /builder /builder/shared-workdir/build
          ./scripts/feeds update base packages luci
          ./scripts/feeds install luci-base bash curl tar jq ca-bundle ca-certificates uhttpd
          cp -r "$GITHUB_WORKSPACE/luci-app-cloudflare-ip/package/luci-app-cloudflare-ip" ./package/
          echo 'CONFIG_PACKAGE_luci-app-cloudflare-ip=y' >> .config
          make defconfig
      - name: Build package
        shell: bash
        working-directory: /builder
        run: |
          set -euo pipefail
          if [ "${{ matrix.pkgtype }}" = apk ]; then
            # APK rejects the source development suffix. Patch only the
            # checked-out package Makefile so dependency PKG_VERSION values
            # remain untouched and the source contract stays exact.
            sed -i 's/^PKG_VERSION:=2.0.0-dev$/PKG_VERSION:=2.0.0.1/' package/luci-app-cloudflare-ip/Makefile
            make package/luci-app-cloudflare-ip/compile V=sc
          else
            make package/luci-app-cloudflare-ip/compile V=sc
          fi
      - name: Inspect package artifact
        shell: bash
        working-directory: /builder
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          files=$(find ./bin -type f -name "luci-app-cloudflare-ip*.${{ matrix.pkgtype }}")
          test -n "$files"
          printf '%s\n' "$files" | while IFS= read -r file; do
            cp "$file" "$GITHUB_WORKSPACE/output/"
            case "${file##*.}" in
              ipk|apk) tar -tf "$file" >/dev/null ;;
            esac
          done
          sha256sum "$GITHUB_WORKSPACE/output"/* > "$GITHUB_WORKSPACE/output/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-cloudflare-ip-${{ matrix.pkgtype }}-${{ matrix.branch }}
          path: output/
          if-no-files-found: error

  package-release-guard:
    runs-on: ubuntu-latest
    needs: [host-contract, rill-native, openwrt-package]
    steps:
      - uses: actions/checkout@v4
      - name: Verify development release guard
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^PKG_VERSION:=//p' package/luci-app-cloudflare-ip/Makefile | head -n1)
          test "$version" = 2.0.0-dev

  rpc-luci-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install contract tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: RPC and LuCI dispatch contracts
        run: |
          set -euo pipefail
          bash tests/legacy/rpc-roundtrip.sh
          bash tests/legacy/luci-static-contract.sh
          jq empty package/luci-app-cloudflare-ip/root/usr/share/luci/menu.d/luci-app-cloudflare-ip.json
          jq empty package/luci-app-cloudflare-ip/root/usr/share/rpcd/acl.d/luci-app-cloudflare-ip.json

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest "$RUNNER_TEMP/bin"
      - name: Lint workflows
        run: "${{ runner.temp }}/bin/actionlint"

  qualification-guard:
    if: always()
    needs: [host-contract, legacy-contract, rpc-luci-contract, rill-native, rill-musl-build-and-execute, openwrt-package, package-release-guard, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every qualification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")'
          echo QUALIFICATION_COMPLETE
