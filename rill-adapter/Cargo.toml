[package]
name = "cf-ip-rill-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
description = "Consumer-owned RillML shadow ranking adapter for luci-app-cloudflare-ip"

[[bin]]
name = "cf-ip-rill"
path = "src/main.rs"

[dependencies]
rill-ml = { version = "=1.5.3", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
